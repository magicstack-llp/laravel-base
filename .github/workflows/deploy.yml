name: Build and Publish Docker image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g., latest, 1.0.0, etc.)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-release:
    name: create github release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
  build:
    name: Build PHP ${{ matrix.php-version }} (${{ matrix.arch }})
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4", "8.5"]
        arch: [amd64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Determine Docker Hub Target
        id: dockerhub
        env:
          DOCKERHUB_USER: ${{ env.DOCKERHUB_USERNAME }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -n "$DOCKERHUB_USER" ]; then
            echo "target=,docker.io/$DOCKERHUB_USER/$REPO_NAME" >> $GITHUB_OUTPUT
          else
            echo "target=" >> $GITHUB_OUTPUT
          fi

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
          platforms: linux/${{ matrix.arch }}
          outputs: |
            type=image,name=ghcr.io/${{ github.repository }}${{ steps.dockerhub.outputs.target }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=php-${{ matrix.php-version }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php-version }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-php${{ matrix.php-version }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Manifests for PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    needs: build
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      matrix:
        php-version: ["8.2", "8.3", "8.4", "8.5"]

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-php${{ matrix.php-version }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        env:
          DOCKERHUB_USER: ${{ env.DOCKERHUB_USERNAME }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          PHP_VER="${{ matrix.php-version }}"
          DEFAULT_PHP_VER="8.2"

          GHCR_TAGS=()
          DH_TAGS=()

          GHCR_BASE="ghcr.io/${{ github.repository }}"
          DH_BASE="docker.io/${DOCKERHUB_USER}/${REPO_NAME}"

          add_tags() {
            local tag_val=$1
            GHCR_TAGS+=("${GHCR_BASE}:${tag_val}")
            if [ -n "${DOCKERHUB_USER}" ]; then
              DH_TAGS+=("${DH_BASE}:${tag_val}")
            fi
          }

          # Version-specific tags
          add_tags "${PHP_VER}"
          add_tags "${PHP_VER}-fpm-alpine"
          add_tags "php${PHP_VER}"

          # Tags from GitHub ref or manual dispatch
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            GIT_TAG="${{ github.ref_name }}"
            VERSION="${GIT_TAG#v}"
            IFS='.' read -r major minor patch <<< "$VERSION"
            
            add_tags "${VERSION}-php${PHP_VER}"
            if [ -n "$minor" ]; then
              add_tags "${major}.${minor}-php${PHP_VER}"
            fi
            add_tags "${major}-php${PHP_VER}"
            
            if [ "${PHP_VER}" = "${DEFAULT_PHP_VER}" ]; then
              add_tags "${VERSION}"
              if [ -n "$minor" ]; then
                add_tags "${major}.${minor}"
              fi
              add_tags "${major}"
              add_tags "latest"
            fi
            
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ github.event.inputs.tag }}"
            if [ -n "${INPUT_TAG}" ]; then
              add_tags "${INPUT_TAG}-php${PHP_VER}"
              if [ "${PHP_VER}" = "${DEFAULT_PHP_VER}" ]; then
                add_tags "${INPUT_TAG}"
              fi
            fi
          fi

          # Build source lists
          GHCR_SOURCES=""
          DH_SOURCES=""
          for f in $(ls /tmp/digests); do
            GHCR_SOURCES="${GHCR_SOURCES} ${GHCR_BASE}@sha256:${f}"
            if [ -n "${DOCKERHUB_USER}" ]; then
              DH_SOURCES="${DH_SOURCES} ${DH_BASE}@sha256:${f}"
            fi
          done

          # Push manifests to GHCR
          for tag in "${GHCR_TAGS[@]}"; do
            echo "Creating and pushing GHCR manifest for $tag..."
            docker buildx imagetools create -t "$tag" $GHCR_SOURCES
          done

          # Push manifests to Docker Hub if credentials are set
          if [ -n "${DOCKERHUB_USER}" ]; then
            for tag in "${DH_TAGS[@]}"; do
              echo "Creating and pushing Docker Hub manifest for $tag..."
              docker buildx imagetools create -t "$tag" $DH_SOURCES
            done
          fi
